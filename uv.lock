[[package]]
name = "zj-uav-tracking-preview"
version = "0.1.0"
source = { editable = "." }
dependencies = [
    { name = "fastapi" },
    { name = "numpy", version = "2.4.6", source = { registry = "https://pypi.org/simple" }, marker = "python_full_version < '3.12'" },
    { name = "numpy", version = "2.5.3", source = { registry = "https://pypi.org/simple" }, marker = "python_full_version >= '3.12'" },
    { name = "opencv-contrib-python" },
    { name = "uvicorn", extra = ["standard"] },
]

[package.optional-dependencies]
all = [
    { name = "clip" },
    { name = "lap" },
    { name = "pymavlink" },
    { name = "torch" },
    { name = "torchvision" },
    { name = "ultralytics" },
]
telemetry = [
    { name = "pymavlink" },
]
vision = [
    { name = "clip" },
    { name = "lap" },
    { name = "torch" },
    { name = "torchvision" },
    { name = "ultralytics" },
]

[package.dev-dependencies]
dev = [
    { name = "pytest" },
]

[package.metadata]
requires-dist = [
    { name = "clip", marker = "extra == 'all'", git = "https://github.com/ultralytics/CLIP.git" },
    { name = "clip", marker = "extra == 'vision'", git = "https://github.com/ultralytics/CLIP.git" },
    { name = "fastapi", specifier = ">=0.116,<1" },
    { name = "lap", marker = "extra == 'all'", specifier = ">=0.5.12,<1" },
    { name = "lap", marker = "extra == 'vision'", specifier = ">=0.5.12,<1" },
    { name = "numpy", specifier = ">=2.0,<3" },
    { name = "opencv-contrib-python", specifier = ">=4.12,<5" },
    { name = "pymavlink", marker = "extra == 'all'", specifier = ">=2.4.49,<3" },
    { name = "pymavlink", marker = "extra == 'telemetry'", specifier = ">=2.4.49,<3" },
    { name = "torch", marker = "extra == 'all'", specifier = "==2.14.0", index = "https://download.pytorch.org/whl/cu130" },
    { name = "torch", marker = "extra == 'vision'", specifier = "==2.14.0", index = "https://download.pytorch.org/whl/cu130" },
    { name = "torchvision", marker = "extra == 'all'", specifier = "==0.29.0", index = "https://download.pytorch.org/whl/cu130" },
    { name = "torchvision", marker = "extra == 'vision'", specifier = "==0.29.0", index = "https://download.pytorch.org/whl/cu130" },
    { name = "ultralytics", marker = "extra == 'all'", specifier = ">=8.3,<9" },
    { name = "ultralytics", marker = "extra == 'vision'", specifier = ">=8.3,<9" },
    { name = "uvicorn", extras = ["standard"], specifier = ">=0.35,<1" },
]
provides-extras = ["vision", "telemetry", "all"]

[package.metadata.requires-dev]
dev = [{ name = "pytest", specifier = ">=8.4,<10" }]
